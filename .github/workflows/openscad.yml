name: OpenSCAD STL

on:
  push:
    paths:
      - "**/*.scad"
      - ".github/workflows/openscad.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache OpenSCAD
        id: cache-openscad
        uses: actions/cache@v4
        with:
          path: /usr/bin/openscad
          key: openscad-ubuntu-2023

      - name: Install OpenSCAD
        if: steps.cache-openscad.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Render STL
        run: |
          openscad -o model.stl model.scad

      - name: Upload STL to Dropbox sandbox
        env:
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
        run: |
          curl -X POST https://content.dropboxapi.com/2/files/upload \
            --header "Authorization: Bearer $DROPBOX_TOKEN" \
            --header "Dropbox-API-Arg: {\"path\": \"/Apps/github-sandbox/model.stl\", \"mode\": \"overwrite\", \"autorename\": false, \"mute\": true}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @model.stl