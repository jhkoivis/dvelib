name: OpenSCAD STL

on:
  push:
    paths:
      - "**/*.scad"
      - ".github/workflows/openscad.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get Dropbox access token
        env:
          APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          response=$(curl -sS https://api.dropbox.com/oauth2/token \
            -d grant_type=refresh_token \
            -d refresh_token="$REFRESH_TOKEN" \
            -d client_id="$APP_KEY" \
            -d client_secret="$APP_SECRET")

          ACCESS_TOKEN=$(echo "$response" | jq -r .access_token)

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to obtain Dropbox access token"
            echo "$response" | jq .
            exit 1
          fi

          echo "DROPBOX_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Cache OpenSCAD
        id: cache-openscad
        uses: actions/cache@v4
        with:
          path: /usr/bin/openscad
          key: openscad-ubuntu-2023

      - name: Install OpenSCAD
        if: steps.cache-openscad.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Render STL
        run: |
          openscad -o model.stl model.scad

      - name: Upload STL to Dropbox
        run: |
          curl -sS -X POST https://content.dropboxapi.com/2/files/upload \
            --header "Authorization: Bearer $DROPBOX_TOKEN" \
            --header "Dropbox-API-Arg: {\"path\": \"/model.stl\", \"mode\": \"overwrite\", \"autorename\": false, \"mute\": true}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @model.stl