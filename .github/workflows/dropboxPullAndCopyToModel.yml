name: Dropbox pull and copy newest scad to model.scad

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get Dropbox access token
        env:
          APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          response=$(curl -sS https://api.dropbox.com/oauth2/token \
            -d grant_type=refresh_token \
            -d refresh_token="$REFRESH_TOKEN" \
            -d client_id="$APP_KEY" \
            -d client_secret="$APP_SECRET")

          echo "Token response"
          echo "$response" | jq .

          ACCESS_TOKEN=$(echo "$response" | jq -r .access_token)

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to obtain Dropbox access token"
            exit 1
          fi

          echo "DROPBOX_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

      - name: Download everything from Dropbox with debug output
        run: |
          set -euo pipefail

          echo "Listing Dropbox folder contents"
          response=$(curl -sS -X POST https://api.dropboxapi.com/2/files/list_folder \
            --header "Authorization: Bearer $DROPBOX_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"path": "/Apps/github-sandbox"}')

          if echo "$response" | jq -e '.error' >/dev/null; then
            echo "Dropbox API error"
            echo "$response" | jq .
            exit 1
          fi

          echo "Raw Dropbox response"
          echo "$response" | jq .

          echo "Files found"
          echo "$response" \
            | jq -r '.entries[] | select(.[".tag"]=="file") | "\(.name)  \(.client_modified)"'

          echo "Downloading files"
          echo "$response" \
            | jq -r '.entries[] | select(.[".tag"]=="file") | .path_lower' \
            | while read -r dbx_path; do
                fname="$(basename "$dbx_path")"
                echo "Downloading $fname"
                curl -sS -X POST https://content.dropboxapi.com/2/files/download \
                  --header "Authorization: Bearer $DROPBOX_TOKEN" \
                  --header "Dropbox-API-Arg: {\"path\": \"$dbx_path\"}" \
                  --output "$fname"
              done

          echo "Workspace after download"
          ls -lh

      - name: Select newest SCAD as model.scad
        run: |
          set -euo pipefail

          newest_scad=$(ls -1t *.scad 2>/dev/null | head -n 1 || true)

          if [ -n "${newest_scad:-}" ]; then
            echo "Newest SCAD is $newest_scad"
            cp -f "$newest_scad" model.scad
          else
            echo "No scad files found"
          fi

      - name: Commit changes if any
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Pull from Dropbox and update model.scad"
          git push