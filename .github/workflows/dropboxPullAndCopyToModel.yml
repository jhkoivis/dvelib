name: Pull SCAD files from Dropbox

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all SCAD files from Dropbox
        env:
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
        run: |
          set -euo pipefail

          response=$(curl -sS -X POST https://api.dropboxapi.com/2/files/list_folder \
            --header "Authorization: Bearer $DROPBOX_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"path": "/Apps/github-sandbox"}')

          echo "$response" \
            | jq -r '.entries[] | select(.[".tag"]=="file") | select(.name | endswith(".scad")) | .path_lower' \
            | while read -r dbx_path; do
                fname="$(basename "$dbx_path")"
                curl -sS -X POST https://content.dropboxapi.com/2/files/download \
                  --header "Authorization: Bearer $DROPBOX_TOKEN" \
                  --header "Dropbox-API-Arg: {\"path\": \"$dbx_path\"}" \
                  --output "$fname"
              done

      - name: Select newest SCAD as model.scad
        run: |
          set -euo pipefail
          newest_scad=$(ls -1t *.scad 2>/dev/null | head -n 1 || true)
          if [ -n "${newest_scad:-}" ]; then
            cp -f "$newest_scad" model.scad
          else
            echo "No .scad files found"
          fi

      - name: Commit changes if any
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.scad model.scad 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Sync SCAD files from Dropbox"
          git push